<!DOCTYPE html>
<html>
<head>
    <title>
        Pesanan Diproses - Minimal Ngopi Dapur
    </title>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/dapur.css">
</head>
<body>
<table width="100%" height="100%" border="0" id="layout-utama">
    <tr>

        <!-- ===== SIDEBAR ===== -->
        <!-- Tutup tag </td> langsung di baris ini, isi sidebar digenerate oleh sidebar.js -->
        <td width="250px" valign="top" class="sidebar" id="sidebar" data-aktif="pesanan_diproses.html"></td>

        <!-- ===== KONTEN ===== -->
        <td valign="top" class="content">

            <!-- TOP BAR -->
            <div class="topbar">
                <table width="100%" border="0">
                    <tr>
                        <td valign="middle">
                            <p class="breadcrumb">
                                Dapur /
                                <b class="breadcrumb-active">
                                    Pesanan Diproses
                                </b>
                            </p>
                        </td>
                        <td align="right" valign="middle">
                            <div class="profile">
                                <span class="avatar">
                                    B
                                </span>
                                <span class="profile-name">
                                    Barista 01
                                </span>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>

            <!-- JUDUL HALAMAN -->
            <table width="100%" border="0">
                <tr>
                    <td valign="top">
                        <h1 class="greeting">
                            Pesanan Diproses
                        </h1>
                        <p class="date">
                            2 pesanan sedang dibuat.
                        </p>
                    </td>
                    <td align="right" valign="middle">
                        <p class="clock">
                            09.20
                        </p>
                    </td>
                </tr>
            </table>
            <table width="100%" border="0" class="row">
                <tr>
                    <td width="32%" valign="top" class="card card-proc">
                        <table width="100%" border="0">
                            <tr>
                                <td>
                                    <p class="card-title">
                                        Meja 2
                                    </p>
                                    <p class="meta">
                                        MN-039 &middot; 09:05
                                    </p>
                                </td>
                                <td align="right" valign="top">
                                    <span class="tag tag-proc">
                                        Diproses
                                    </span>
                                </td>
                            </tr>
                        </table>
                        <table width="100%" border="0" class="mt-15">
                            <tr>
                                <td width="34" valign="top" class="it-qty">
                                    2x
                                </td>
                                <td class="it-name">
                                    Cappuccino
                                </td>
                            </tr>
                            <tr>
                                <td width="34" valign="top" class="it-qty">
                                    1x
                                </td>
                                <td class="it-name">
                                    Kentang Goreng
                                </td>
                            </tr>
                        </table>
                        <p class="actions">
                            <a href="detail_pesanan.html" class="btn-secondary btn-link">
                                Lihat detail
                            </a>
                            <a href="#" class="btn-primary btn-link" onclick="selesaikanPesanan(this); return false;">
                                Tandai selesai
                            </a>
                        </p>
                    </td>
                    <td width="20px">
                    </td>
                    <td width="32%" valign="top" class="card card-proc">
                        <table width="100%" border="0">
                            <tr>
                                <td>
                                    <p class="card-title">
                                        Meja 3
                                    </p>
                                    <p class="meta">
                                        MN-040 &middot; 09:08
                                    </p>
                                </td>
                                <td align="right" valign="top">
                                    <span class="tag tag-proc">
                                        Diproses
                                    </span>
                                </td>
                            </tr>
                        </table>
                        <table width="100%" border="0" class="mt-15">
                            <tr>
                                <td width="34" valign="top" class="it-qty">
                                    3x
                                </td>
                                <td class="it-name">
                                    Matcha Coffe
                                </td>
                            </tr>
                        </table>
                        <p class="card-note">
                            Catatan: Less Ice.
                        </p>
                        <p class="actions">
                            <a href="detail_pesanan.html" class="btn-secondary btn-link">
                                Lihat detail
                            </a>
                            <a href="#" class="btn-primary btn-link" onclick="selesaikanPesanan(this); return false;">
                                Tandai selesai
                            </a>
                        </p>
                    </td>
                    <td width="20px">
                    </td>
                    <td width="32%">
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

<!-- PEMANGGILAN SCRIPT -->
<script src="../assets/js/sidebar.js"></script>
<script src="../assets/js/pesanan_diproses.js"></script>
<script src="../assets/js/logout.js"></script>
</body>
</html>
