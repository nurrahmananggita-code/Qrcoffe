<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Minimal Ngopi Dapur</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap">

    <!-- Sesuaikan alamat ini dengan lokasi dapur.css di proyek Anda -->
    <link rel="stylesheet" href="../assets/css/dapur.css">
</head>

<body>

    <table class="login-layout">
        <tr>

            <!-- ===== PANEL KIRI ===== -->
            <td class="login-art">

                <table class="login-art-table">

                    <tr>
                        <td class="login-art-top">
                            <div class="login-brand">
                                Minimal Ngopi
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td class="login-art-mid">
                            <h1 class="login-title">
                                Pesanan masuk, kopi keluar.
                            </h1>
                            <p class="login-desc">
                                Layar kerja tim dapur untuk melihat,
                                menyiapkan, dan menyelesaikan pesanan.
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td class="login-art-bot">
                            Dapur · Cabang Karanganyar
                        </td>
                    </tr>

                </table>

            </td>

            <!-- ===== PANEL KANAN (FORM) ===== -->
            <td class="login-form-cell">

                <div class="login-box">

                    <form action="dashboard.html" method="get">

                        <h2 class="login-heading">
                            Masuk ke Dapur
                        </h2>

                        <div class="login-field">
                            <label class="login-label" for="username">
                                Username
                            </label>
                            <input
                                class="login-input"
                                type="text"
                                id="username"
                                name="username"
                                placeholder="mis. barista01"
                                autocomplete="username"
                                required>
                        </div>

                        <div class="login-field">
                            <label class="login-label" for="password">
                                Kata sandi
                            </label>
                            <input
                                class="login-input"
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Masukkan kata sandi"
                                autocomplete="current-password"
                                required>
                        </div>

                        <button class="login-btn" type="submit">
                            Masuk
                        </button>

                    </form>

                </div>

            </td>

        </tr>
    </table>

</body>

</html>
