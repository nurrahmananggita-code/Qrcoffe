<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detail Menu - Qrcoffee</title>
    <link rel="stylesheet" href="../assets/css/customer.css">
</head>

<body>

<div class="phone">

    <div class="detail-page">

        <!-- Foto menu -->
        <img id="detail-photo"
             src="../assets/images/kopi_susu_gula_aren.png"
             alt="Foto menu"
             class="detail-photo">

        <!-- Nama dan harga -->
        <div class="detail-title">
            <h1 id="detail-name" class="detail-name">
                Kopi Susu Gula Aren
            </h1>

            <p id="detail-price" class="detail-price">
                Rp24.000
            </p>
        </div>

        <!-- Deskripsi menu -->
        <div class="detail-desc">
            <p id="detail-desc">
                Espresso, susu segar, gula aren cair.
            </p>
        </div>

        <!-- Kategori dan informasi kafein -->
        <div class="detail-tags" id="detail-tags">
            <span id="detail-category">Kopi</span>
            <span id="detail-caffeine">Kafein sedang</span>
        </div>

        <!-- Pilihan menu akan diisi oleh JavaScript -->
        <div id="pilihan-menu"></div>

        <!-- Catatan pelanggan -->
        <div class="detail-section">
            <h3>Catatan</h3>

            <textarea
                id="catatan"
                class="note-input"
                placeholder="Contoh: tanpa es, less sugar..."></textarea>
        </div>

        <!-- Jumlah dan tombol tambah -->
        <div class="detail-bottom">

            <div class="quantity">
                <button type="button"
                        class="quantity-btn"
                        id="kurang">−</button>

                <span id="jumlah">1</span>

                <button type="button"
                        class="quantity-btn"
                        id="tambah">+</button>
            </div>

            <button type="button" class="add-cart" id="tambah-keranjang">
                Tambah · Rp24.000
            </button>

        </div>

    </div>

</div>

<script src="../assets/js/customer_detail.js"></script>

</body>
</html>
