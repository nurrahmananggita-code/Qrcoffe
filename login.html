<!-- struktur tag html-->
<html>
    <head>
        <title>
            Masuk - Admin Outlet
        </title>
    </head>

<body style="
    background: #0C1524;
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #E6EEF8;
">

    <table width="100%" height="100%" border="0">
        <tr>
            <td valign="middle">

                <div style="width: 430px; margin: auto;">

                    <h1 style="
                        font-family: 'Segoe UI', Arial, sans-serif;
                        font-size: 40px;
                        margin: 0;
                        white-space: nowrap;
                    ">
                        Masuk ke Admin Outlet
                    </h1>

                    <p style="
                        color: #93A6C0;
                        margin-top: 8px;
                        margin-bottom: 28px;
                    ">
                        Gunakan akun PIC outlet.
                    </p>

                    <form action="dashboard.html">

                        <label>Email</label>
                        <br>

                        <input
                            type="email"
                            name="email"
                            placeholder="Masukkan email"
                            required
                            style="
                                width: 400px;
                                padding: 14px;
                                margin-top: 8px;
                                background: #162235;
                                border: 1px solid #293B54;
                                border-radius: 8px;
                                color: white;
                                font-size: 16px;
                                outline: none;
                            "
                        >

                        <br><br>

                        <label>Kata Sandi</label>
                        <br>

                        <input
                            type="password"
                            name="password"
                            placeholder="Masukkan kata sandi"
                            required
                            style="
                                width: 400px;
                                padding: 14px;
                                margin-top: 8px;
                                background: #162235;
                                border: 1px solid #293B54;
                                border-radius: 8px;
                                color: white;
                                font-size: 16px;
                                outline: none;
                            "
                        >

                        <br>

                        <div style="margin-top: 8px;">

                            <label>
                                <input type="checkbox" name="remember">
                                Ingat saya di perangkat ini
                            </label>

                            <a href="#" style="
                                color: #6EA8FE;
                                margin-left: 60px;
                            ">
                                Lupa kata sandi?
                            </a>

                        </div>

                        <br>

                        <button
                            type="submit"
                            style="
                                width: 430px;
                                padding: 14px;
                                margin-top: 8px;
                                background: #6EA8FE;
                                border: none;
                                border-radius: 8px;
                                color: #0C1524;
                                font-size: 16px;
                                font-weight: bold;
                                cursor: pointer;
                            "
                        >
                            Masuk
                        </button>

                    </form>

                </div>

            </td>
        </tr>
    </table>

</body>
</html>
