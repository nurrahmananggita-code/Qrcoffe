<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Outlet – Dapur Senja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF2FA;--surface:#FFFFFF;--surface2:#F3F8FD;--ink:#0F1E33;--muted:#5F7189;--line:#D3DFEC;
  --side:#12294D;--side2:#1D3F73;--side-ink:#D6E4F7;
  --primary:#16335F;--on-primary:#FFFFFF;--accent:#5AAEE8;--accent-soft:#D9ECFB;
  --ok:#1D4F91;--ok-bg:#D3E6FA;--warn:#2A6FB5;--warn-bg:#E3F0FC;--bad:#0F2A52;--bad-bg:#C5D8EE;--info:#3A86C8;--info-bg:#DDEEFB;
  --shadow:0 1px 2px rgba(15,35,70,.08);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1524;--surface:#14213A;--surface2:#19294A;--ink:#E6EEF8;--muted:#93A6C0;--line:#24365A;
    --side:#08101D;--side2:#12294D;--side-ink:#A9C1E3;
    --primary:#8FCDF8;--on-primary:#0B1B30;--accent:#5AAEE8;--accent-soft:#1B3558;
    --ok:#8FCDF8;--ok-bg:#1B3558;--warn:#6BB8F0;--warn-bg:#12324F;--bad:#C9DDF5;--bad-bg:#2A3F66;--info:#7FB6D6;--info-bg:#15303F;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1524;--surface:#14213A;--surface2:#19294A;--ink:#E6EEF8;--muted:#93A6C0;--line:#24365A;
  --side:#08101D;--side2:#12294D;--side-ink:#A9C1E3;
  --primary:#8FCDF8;--on-primary:#0B1B30;--accent:#5AAEE8;--accent-soft:#1B3558;
  --ok:#8FCDF8;--ok-bg:#1B3558;--warn:#6BB8F0;--warn-bg:#12324F;--bad:#C9DDF5;--bad-bg:#2A3F66;--info:#7FB6D6;--info-bg:#15303F;
  --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.side{position:fixed;inset:0 auto 0 0;width:248px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:20px 14px 16px;overflow-y:auto;z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;color:#fff}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#0B1F3F;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.02em}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--side-ink);opacity:.8}
.navgrp{margin-top:14px}
.navgrp>span{display:block;font-size:12px;font-weight:600;color:var(--side-ink);opacity:.65;padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:9px;color:var(--side-ink);background:none;border:0;cursor:pointer;text-align:left;font-weight:500}
.nav:hover{background:var(--side2);color:#fff}
.nav.on{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .badge{margin-left:auto;background:var(--accent);color:#0B1F3F;font-size:12px;font-weight:700;border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.pic{margin-top:auto;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.1)}
.pic p{font-size:12px;opacity:.75;margin-bottom:8px}
.pic .who{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;font-size:13px;margin-bottom:6px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--accent);color:#0B1F3F;flex:none}
.av.b{background:#A9D4F5}
.main{margin-left:248px;min-height:100vh}
.top{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:16px;padding:14px 32px;border-bottom:1px solid var(--line)}
.crumb{color:var(--muted);font-size:13px}
.crumb b{color:var(--ink);font-weight:600}
.top .sp{flex:1}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn i{position:absolute;top:-5px;right:-5px;background:var(--bad);color:var(--bg);border-radius:99px;font-size:11px;font-style:normal;font-weight:700;padding:0 5px;min-width:18px;text-align:center}
.chip{display:flex;align-items:center;gap:9px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-weight:600;font-size:13px}
#view{padding:28px 32px 56px;max-width:1360px}

/* common */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.pagehead h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.pagehead p{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.panel>.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 0}
.panel>.ph h2{font-size:15px;font-weight:700}
.panel>.pb{padding:16px 20px 20px}
.link{color:var(--primary);font-weight:600;font-size:13px;background:none;border:0;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}
.grid{display:grid;gap:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
th.r,td.r{text-align:right}
.tw{overflow-x:auto}
.toolbar{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.inp,.sel,.txt{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;width:100%}
.txt{height:auto;padding:10px 12px;resize:vertical;min-height:88px}
.inp:focus,.sel:focus,.txt:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:var(--primary)}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search svg{position:absolute;left:11px;top:10px;color:var(--muted)}
.search .inp{padding-left:36px}
.toolbar .sel{width:auto;min-width:150px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label{font-weight:600;font-size:13px}
.field small{color:var(--muted);font-size:12.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pre{position:relative}
.pre>span{position:absolute;left:12px;top:9px;color:var(--muted);font-weight:600}
.pre .inp{padding-left:40px}
.sw{position:relative;display:inline-block;width:40px;height:23px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--primary)}
.sw input:checked+i::after{transform:translateX(17px)}
.sw input:focus-visible+i{outline:2px solid var(--primary);outline-offset:2px}
.tile{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.cell{display:flex;align-items:center;gap:12px}
.cell b{display:block;font-weight:600}
.cell small{color:var(--muted);font-size:12.5px}
.iconrow{display:flex;gap:4px;justify-content:flex-end}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:var(--side);color:#fff;padding:44px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.login-art h1{font-size:40px;line-height:1.12;font-weight:800;letter-spacing:-.03em;margin-top:auto;max-width:14ch}
.login-art p{color:var(--side-ink);margin-top:14px;max-width:38ch;font-size:15px}
.ticketwrap{margin:44px 0 auto;padding-top:44px}
.ticket{background:#F4F9FF;color:#0F1E33;width:290px;padding:18px 20px 22px;border-radius:6px;transform:rotate(-2.5deg);box-shadow:0 18px 40px rgba(0,0,0,.35);font-size:13px;position:relative}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:radial-gradient(circle at 6px 0,#F4F9FF 5px,transparent 5.5px) 0 0/12px 8px repeat-x}
.ticket .t1{display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.ticket hr{border:0;border-top:1.5px dashed #BFD3EA;margin:11px 0}
.ticket li{display:flex;justify-content:space-between;list-style:none;padding:2px 0}
.ticket ul{margin:0;padding:0}
.ticket .nt{font-style:italic;color:#4A6384;margin-top:8px}
.ticket .st{display:inline-block;margin-top:10px;background:#5AAEE8;color:#0B1F3F;font-weight:700;padding:2px 10px;border-radius:99px;font-size:12px}
.ticket2{position:absolute;right:-30px;bottom:60px;transform:rotate(4deg);opacity:.5;width:220px;height:150px;background:#F4F9FF;border-radius:6px}
.login-form{display:grid;place-items:center;padding:40px;background:var(--bg)}
.login-form form{width:100%;max-width:380px}
.login-form h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.login-form .sub{color:var(--muted);margin:6px 0 26px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:20px}
.login-form .btn{width:100%;height:44px}
.login-form .foot{margin-top:22px;font-size:13px;color:var(--muted);text-align:center}

/* dashboard */
.dash{grid-template-columns:minmax(0,1.9fr) minmax(320px,1fr);margin-bottom:20px}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.bignum{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.delta{color:var(--ok);font-weight:600;font-size:13px}
.kpis{display:flex;gap:32px;margin-top:14px}
.kpis div span{display:block;color:var(--muted);font-size:12.5px}
.kpis div b{font-size:17px;font-weight:700}
.chart{width:100%;height:auto;display:block;margin-top:14px}
.qlist{display:flex;flex-direction:column}
.qitem{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line);cursor:pointer}
.qitem:hover{background:var(--surface2)}
.qitem .tno{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.qitem .tno.pr{background:var(--info-bg);color:var(--info)}
.qitem .tno.sp{background:var(--ok-bg);color:var(--ok)}
.qitem .grow{flex:1;min-width:0}
.qitem .grow b{display:block;font-weight:600}
.qitem .grow small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmap{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tmap button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:700;cursor:pointer;color:var(--muted)}
.tmap button.terisi{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tmap button.dibersihkan{background:var(--info-bg);border-color:transparent;color:var(--info)}
.tmap button.nonaktif{opacity:.45;text-decoration:line-through}
.legend{display:flex;gap:14px;margin-top:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--surface2);border:1px solid var(--line)}
.legend .l2::before{background:var(--accent-soft);border-color:var(--accent)}
.legend .l3::before{background:var(--info-bg);border-color:transparent}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.rank li:last-child{border:0}
.rank .bar{height:6px;border-radius:3px;background:var(--surface2);flex:1;overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--primary);border-radius:3px}
.rank .nm{width:150px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .q{width:54px;text-align:right;color:var(--muted)}

/* orders */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:start}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px}
.col>h2{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:4px 6px 12px}
.col>h2 em{font-style:normal;background:var(--surface);border:1px solid var(--line);border-radius:99px;font-size:12px;padding:0 8px;color:var(--muted)}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.ocard:hover{border-color:var(--muted)}
.ohead{display:flex;align-items:center;gap:8px}
.ohead b{font-size:16px;font-weight:800}
.ohead .oid{color:var(--muted);font-size:12.5px}
.ohead .ago{margin-left:auto;font-size:12.5px;color:var(--warn);font-weight:600}
.ocard ul{list-style:none;margin:10px 0;padding:0;font-size:13.5px}
.ocard li{display:flex;gap:8px;padding:2px 0}
.ocard li b{color:var(--muted);font-weight:600;width:22px}
.ocard .note{background:var(--accent-soft);border-radius:8px;padding:6px 10px;font-size:12.5px;margin-bottom:10px}
.ofoot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.ofoot .tot{font-weight:700}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px}
.detail{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.sum{padding:0 20px 20px}
.sum div{display:flex;justify-content:space-between;padding:5px 0;color:var(--muted)}
.sum div.t{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;color:var(--ink);font-weight:800;font-size:17px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 18px 30px;color:var(--muted)}
.tl li::before{content:"";position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.tl li::after{content:"";position:absolute;left:8px;top:22px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.done{color:var(--ink)}
.tl li.done::before{background:var(--primary);border-color:var(--primary)}
.tl li.done::after{background:var(--primary)}
.tl li b{display:block;font-weight:600}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;padding:16px 20px 20px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}

/* tables & cats */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.tcard{padding:16px}
.tcard .no{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.tcard .meta{color:var(--muted);font-size:13px;margin:8px 0 14px}
.tcard .top2{display:flex;justify-content:space-between;align-items:flex-start}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:20px;align-items:start}
.catrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.catrow:last-child{border:0}
.catrow .grip{color:var(--muted);cursor:grab}
.catrow .grow{flex:1}
.catrow .grow b{display:block;font-weight:600}
.catrow .grow small{color:var(--muted)}

/* qr */
.qrsplit{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.qrlist{max-height:560px;overflow:auto;padding:8px}
.qrlist button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:10px 12px;border:0;background:none;border-radius:9px;cursor:pointer;font-weight:600;text-align:left}
.qrlist button:hover{background:var(--surface2)}
.qrlist button.on{background:var(--primary);color:var(--on-primary)}
.qrlist small{opacity:.7;font-weight:500}
.poster{background:#fff;color:#0F1E33;border-radius:16px;width:340px;padding:28px 28px 24px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.15);border-top:8px solid var(--accent);margin:0 auto}
.poster .pn{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;justify-content:center}
.poster h3{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:14px 0 14px}
.poster svg.q{width:220px;height:220px;display:block;margin:0 auto}
.poster .mn{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:14px}
.poster p{color:#4A6384;font-size:13px;margin-top:8px}
.poster .url{font-size:12px;color:#5F7189;margin-top:12px;border-top:1px dashed #C5D6EA;padding-top:10px}
.qrall{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.qmini{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:var(--surface);cursor:pointer}
.qmini:hover{border-color:var(--primary)}
.qmini svg{width:100%;height:auto;display:block;border-radius:6px}
.qmini b{display:block;margin-top:6px;font-size:13px}

/* menu form */
.mform{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface2)}
.drop:hover{border-color:var(--primary);color:var(--ink)}
.drop svg{width:28px;height:28px;margin-bottom:6px}
.cust{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}

.hours{width:100%}

.hours .inp{width:100px;height:34px}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbars .r{display:grid;grid-template-columns:120px 1fr 48px;align-items:center;gap:12px}
.hbars .bar{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.hbars .bar i{display:block;height:100%;border-radius:5px;background:var(--primary)}
.hbars .r span:last-child{text-align:right;font-weight:700}
.kpirow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.kpi{padding:16px 18px}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi.hl{background:var(--side);color:#fff;border-color:var(--side)}
.kpi.hl span{color:var(--side-ink)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(6,18,38,.55);display:grid;place-items:center;z-index:20;padding:20px}
.dlg{background:var(--surface);border-radius:16px;width:100%;max-width:440px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.dlg h3{font-size:18px;font-weight:800;margin-bottom:6px}
.dlg .ft{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){

  .qrsplit{grid-template-columns:1fr}
}

/* ---------- charts & qr ---------- */
function bars(vals,labels,opt){
  opt=opt||{};var W=660,H=opt.h||210,L=44,B=26,T=10,n=vals.length,gw=(W-L)/n,bw=Math.min(34,gw*.62);
  var mx=0;vals.forEach(function(v){if(v!=null&&v>mx)mx=v});
  var step=Math.pow(10,Math.floor(Math.log(mx)/Math.LN10));var top=Math.ceil(mx/step)*step;if(top/step<2)top=step*2;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafik penjualan">';
  for(var g=0;g<=4;g++){var y=T+(H-B-T)*(1-g/4);var v=top*g/4;
    s+='<line x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+(v>=1e6?(v/1e6).toFixed(v%1e6?1:0).replace('.',',')+' jt':v>=1e3?Math.round(v/1e3)+' rb':v)+'</text>'}
  var maxI=vals.indexOf(mx);
  vals.forEach(function(v,i){
    var x=L+gw*i+(gw-bw)/2;
    if(v==null){s+='<rect x="'+x+'" y="'+(H-B-3)+'" width="'+bw+'" height="3" rx="1.5" fill="var(--line)"/>'}
    else{var h=(H-B-T)*v/top;s+='<rect x="'+x+'" y="'+(H-B-h)+'" width="'+bw+'" height="'+h+'" rx="4" fill="'+(i===maxI?'var(--accent)':'var(--primary)')+'"><title>'+labels[i]+': '+rp(v)+'</title></rect>'}
    if(n<=14||i%5===0||i===n-1)s+='<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+labels[i]+'</text>';
  });
  return s+'</svg>';
}
function qr(seed,size){
  size=size||25;var s=seed*9301+49297;var rnd=function(){s=(s*9301+49297)%233280;return s/233280};
  var m=[],x,y;for(y=0;y<size;y++){m[y]=[];for(x=0;x<size;x++)m[y][x]=rnd()>.52?1:0}
  function finder(ox,oy){for(var yy=-1;yy<=7;yy++)for(var xx=-1;xx<=7;xx++){var X=ox+xx,Y=oy+yy;if(X<0||Y<0||X>=size||Y>=size)continue;
    var on=(xx>=0&&xx<=6&&yy>=0&&yy<=6)&&(xx===0||xx===6||yy===0||yy===6||(xx>=2&&xx<=4&&yy>=2&&yy<=4));m[Y][X]=on?1:0}}
  finder(0,0);finder(size-7,0);finder(0,size-7);
  var d='';for(y=0;y<size;y++)for(x=0;x<size;x++)if(m[y][x])d+='M'+x+' '+y+'h1v1h-1z';
  return '<svg class="q" viewBox="-2 -2 '+(size+4)+' '+(size+4)+'" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect x="-2" y="-2" width="'+(size+4)+'" height="'+(size+4)+'" fill="#fff"/><path d="'+d+'" fill="#111"/></svg>';
}

function period(k){
  var vals=[],labels=[];
  if(k==='1'){for(var h=8;h<=21;h++){labels.push((h<10?'0':'')+h)}vals=[120,240,380,310,520,860,940,610,420,380,520,690,480,210].map(function(v){return v*1000})}
  else if(k==='7'){labels=['Sel 22','Rab 23','Kam 24','Jum 25','Sab 26','Min 27','Sen 28'];vals=[3420000,3180000,3610000,4470000,6120000,6840000,3980000]}
  else{for(var i=29;i>=0;i--){var d=new Date(2026,8,28-i);labels.push(String(d.getDate()));var wk=d.getDay()===0||d.getDay()===6;vals.push(2900000+((i*37)%11)*170000+(wk?1900000:0))}}
  var sum=0;vals.forEach(function(v){sum+=v});var orders=Math.round(sum/89500);
  return {vals:vals,labels:labels,sum:sum,orders:orders,items:Math.round(orders*2.7),name:{'1':'Hari ini','7':'7 hari terakhir','30':'30 hari terakhir'}[k]};
}

  saldoPanel(p)+
  '<div class="kpirow"><div class="panel kpi hl"><span>Total penjualan</span><b class="num">'+rp(p.sum)+'</b></div><div class="panel kpi"><span>Jumlah pesanan</span><b class="num">'+p.orders.toLocaleString('id-ID')+'</b></div><div class="panel kpi"><span>Rata-rata per pesanan</span><b class="num">'+rp(p.sum/p.orders)+'</b></div><div class="panel kpi"><span>Menu terjual</span><b class="num">'+p.items.toLocaleString('id-ID')+'</b></div></div>'+
  '<section class="panel" style="margin-bottom:20px"><div class="ph"><h2>Penjualan per '+(S.f.period==='1'?'jam':'hari')+'</h2><span class="muted" style="font-size:13px">Batang kuning menandai puncak penjualan</span></div><div class="pb">'+bars(p.vals,p.labels,{h:240})+'</div></section>'+
  '<div class="grid" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)"><section class="panel"><div class="ph"><h2>Menu terlaris</h2></div><div class="tw" style="margin-top:12px"><table><thead><tr><th>Menu</th><th class="r">Terjual</th><th class="r">Pendapatan</th></tr></thead><tbody>'+
   top.map(function(t){var q=Math.round(t[2]*f);return '<tr><td><b style="font-weight:600">'+t[0]+'</b></td><td class="r num">'+q+'</td><td class="r num">'+rp(q*t[1])+'</td></tr>'}).join('')+'</tbody></table></div></section>'+
  '<div class="grid" style="align-content:start"><section class="panel"><div class="ph"><h2>Porsi per kategori</h2></div><div class="pb"><div class="hbars">'+cat.map(function(c){return '<div class="r"><span>'+c[0]+'</span><span class="bar"><i style="width:'+c[1]/38*100+'%"></i></span><span>'+c[1]+'%</span></div>'}).join('')+'</div></div></section>'+
  '<section class="panel"><div class="ph"><h2>Metode pembayaran</h2></div><div class="pb"><div class="hbars">'+pay.map(function(c){return '<div class="r"><span>'+c[0]+'</span><span class="bar"><i style="width:'+c[1]/62*100+'%;background:var(--accent)"></i></span><span>'+c[1]+'%</span></div>'}).join('')+'</div></div></section></div></div>';
}

/* ---------- router ---------- */
function render(){
  var p=(location.hash||'#/login').replace(/^#\/?/,'').split('/');var r=p[0]||'login';var app=$('#app');
  var C=function(a,b){return '<span>Admin Outlet</span> / <b>'+a+'</b>'+(b?' / <b>'+b+'</b>':'')};
  if(r==='login'){app.innerHTML=loginView();document.title='Masuk - Admin Outlet';return}
  var nav=r,crumb,body;
  switch(r){
    case 'dashboard':body=dashboard();crumb=C('Dashboard');break;
    case 'profil':body=profil();crumb=C('Profil Outlet');break;
    case 'menu':
      if(p[1]==='baru'){body=menuForm();crumb=C('Kelola Menu','Tambah menu')}
      else if(p[1]==='edit'){body=menuForm(p[2]);crumb=C('Kelola Menu','Ubah menu')}
      else{body=menuPage();crumb=C('Kelola Menu')}break;
    case 'kategori':body=katPage();crumb=C('Kelola Kategori');break;
    case 'meja':body=mejaPage();crumb=C('Kelola Meja');break;
    case 'qr':body=qrPage(parseInt(p[1],10)||S.f.qrTable);if(p[1])S.f.qrTable=parseInt(p[1],10);crumb=C('QR Code Meja');break;
    case 'pesanan':
      if(p[1]){nav='riwayat';body=detailPage(p[1]);crumb=C('Riwayat Pesanan','Detail '+p[1])}
      else{location.hash='#/riwayat';return}break;
    case 'riwayat':body=riwayat();crumb=C('Riwayat Pesanan');break;
    case 'laporan':body=laporan();crumb=C('Laporan Penjualan');break;
    default:location.hash='#/dashboard';return;
  }
  app.innerHTML=shell(nav,crumb,body);window.scrollTo(0,0);document.title='Admin Outlet - Dapur Senja';
}

/* ---------- ui helpers ---------- */
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2200)}
function modal(h){$('#modal').innerHTML='<div class="scrim">'+'<div class="dlg" role="dialog" aria-modal="true">'+h+'</div></div>'}
function closeModal(){$('#modal').innerHTML=''}

var acts={
  closeModal:closeModal,
  renameCat:function(id){var c=S.cats.filter(function(x){return x.id===id})[0];modal('<h3>Ubah nama kategori</h3><div class="field" style="margin-top:14px"><input id="rc" class="inp" value="'+esc(c.name)+'"></div><div class="ft"><button class="btn" data-act="closeModal">Batal</button><button class="btn primary" data-act="doRename" data-id="'+id+'">Simpan</button></div>')},
  doRename:function(id){var v=$('#rc').value.trim();if(!v){toast('Isi nama kategori dulu');return}S.cats.filter(function(x){return x.id===id})[0].name=v;closeModal();toast('Nama kategori diperbarui');render()},
  delMenu:function(id){var m=S.menus.filter(function(x){return x.id===id})[0];modal('<h3>Hapus menu?</h3><p class="muted">'+esc(m.name)+' akan hilang dari daftar dan tidak bisa dipesan lagi. Untuk sementara, matikan saja tombol Tersedia.</p><div class="ft"><button class="btn" data-act="closeModal">Batal</button><button class="btn primary" data-act="doDelMenu" data-id="'+id+'" style="background:var(--bad);border-color:var(--bad);color:var(--bg)">Hapus menu</button></div>')},
  doDelMenu:function(id){S.menus=S.menus.filter(function(x){return x.id!==id});closeModal();toast('Menu dihapus');render()},
  saveMenu:function(){var f=$('#menuForm');var id=f.getAttribute('data-id');var name=$('#f_name').value.trim();var price=parseInt($('#f_price').value.replace(/\D/g,''),10);
    if(!name){toast('Isi nama menu dulu');$('#f_name').focus();return}
    if(!price){toast('Isi harga menu dulu');$('#f_price').focus();return}
    var d={name:name,cat:$('#f_cat').value,price:price,desc:$('#f_desc').value.trim(),on:$('#f_on').checked};
    if(id){var m=S.menus.filter(function(x){return x.id===id})[0];for(var k in d)m[k]=d[k];toast('Menu diperbarui')}
    else{d.id='m'+Date.now();S.menus.unshift(d);toast('Menu ditambahkan')}
    location.hash='#/menu'},
  addCat:function(){var v=$('#newcat').value.trim();if(!v){toast('Isi nama kategori dulu');return}S.cats.push({id:'c'+Date.now(),name:v,on:true});toast('Kategori ditambahkan');render()},
  delCat:function(id){var n=S.menus.filter(function(m){return m.cat===id}).length;if(n){toast('Pindahkan '+n+' menu ke kategori lain sebelum menghapus');return}S.cats=S.cats.filter(function(c){return c.id!==id});toast('Kategori dihapus');render()},
  withdrawModal:function(){var d=saldoData();modal('<h3>Tarik saldo</h3><p class="muted" style="margin-bottom:16px">Saldo tersedia '+rp(d.bal)+'. Dana dikirim ke rekening yang dipilih.</p><div class="field"><label for="wd_bank">Rekening tujuan</label><select id="wd_bank" class="sel"><option>BCA 4821 a.n. Dapur Senja</option><option>Mandiri 0377 a.n. Dapur Senja</option></select></div><div class="field" style="margin:0"><label for="wd_amt">Jumlah penarikan</label><div class="pre"><span>Rp</span><input id="wd_amt" class="inp num" inputmode="numeric" placeholder="0"></div><small class="muted">Minimal Rp 50.000. <button class="link" data-act="wdAll" type="button">Tarik semua saldo</button></small></div><div class="ft"><button class="btn" data-act="closeModal">Batal</button><button class="btn primary" data-act="doWithdraw">Tarik saldo</button></div>')},
  wdAll:function(){$('#wd_amt').value=saldoData().bal},
  doWithdraw:function(){var d=saldoData();var v=parseInt($('#wd_amt').value.replace(/\D/g,''),10);
    if(!v||v<50000){toast('Minimal penarikan Rp 50.000');return}
    if(v>d.bal){toast('Jumlah melebihi saldo tersedia');return}
    var bank=$('#wd_bank').value.split(' a.n.')[0];
    S.saldo.tx.unshift({d:'28 Sep',k:'Penarikan ke '+bank,amt:-v});closeModal();toast('Penarikan '+rp(v)+' diproses');render()},
  area:function(id,v){S.f.area=v;render()},
  period:function(id,v){S.f.period=v;render()},
  addTableModal:function(){modal('<h3>Tambah meja</h3><p class="muted" style="margin-bottom:16px">QR Code dibuat otomatis setelah meja disimpan.</p><div class="row2"><div class="field"><label for="tn">Nomor meja</label><input id="tn" class="inp" value="'+(S.tables.length+1)+'"></div><div class="field"><label for="tc">Jumlah kursi</label><input id="tc" class="inp" value="4"></div></div><div class="field" style="margin:0"><label for="ta">Area</label><select id="ta" class="sel"><option>Indoor</option><option>Outdoor</option><option>Lantai 2</option></select></div><div class="ft"><button class="btn" data-act="closeModal">Batal</button><button class="btn primary" data-act="saveTable">Simpan meja</button></div>')},
  saveTable:function(){var n=parseInt($('#tn').value,10),c=parseInt($('#tc').value,10);if(!n||!c){toast('Isi nomor meja dan jumlah kursi');return}
    if(S.tables.some(function(t){return t.no===n})){toast('Meja '+n+' sudah ada');return}
    S.tables.push({no:n,cap:c,area:$('#ta').value,status:'kosong'});S.tables.sort(function(a,b){return a.no-b.no});closeModal();toast('Meja '+n+' ditambahkan');render()}
};
var changes={
  toggleShop:function(el){S.shopOpen=el.checked;toast(S.shopOpen?'Toko dibuka, pelanggan bisa memesan':'Toko ditutup, pelanggan tidak bisa memesan');render()},
  toggleMenu:function(el){var m=S.menus.filter(function(x){return x.id===el.getAttribute('data-id')})[0];m.on=el.checked;toast(m.name+(m.on?' tersedia':' ditandai habis'))},
  toggleCat:function(el){var c=S.cats.filter(function(x){return x.id===el.getAttribute('data-id')})[0];c.on=el.checked;toast(c.name+(c.on?' ditampilkan':' disembunyikan'));render()},
  menuCat:function(el){S.f.menuCat=el.value;$('#menuBody').innerHTML=menuRows()},
  riwSt:function(el){S.f.riwSt=el.value;$('#riwBody').innerHTML=riwRows()}
};

document.addEventListener('click',function(e){
  var sc=e.target;if(sc.classList&&sc.classList.contains('scrim')){closeModal();return}
  var a=e.target.closest('[data-act]');
  if(a){e.preventDefault();var fn=acts[a.getAttribute('data-act')];if(fn)fn(a.getAttribute('data-id'),a.getAttribute('data-v'));return}
  var t=e.target.closest('[data-toast]');if(t){toast(t.getAttribute('data-toast'));return}
  var g=e.target.closest('[data-go]');if(g){location.hash=g.getAttribute('data-go')}
});
document.addEventListener('change',function(e){var c=e.target.getAttribute&&e.target.getAttribute('data-change');if(c&&changes[c])changes[c](e.target)});
document.addEventListener('input',function(e){
  var k=e.target.getAttribute&&e.target.getAttribute('data-input');
  if(k==='menuQ'){S.f.menuQ=e.target.value;$('#menuBody').innerHTML=menuRows()}
  if(k==='riwQ'){S.f.riwQ=e.target.value;$('#riwBody').innerHTML=riwRows()}
  if(e.target.closest&&e.target.closest('#menuForm')){
    var n=$('#f_name').value,p=parseInt($('#f_price').value.replace(/\D/g,''),10)||0,d=$('#f_desc').value;
    $('#pv_name').textContent=n||'Nama menu';$('#pv_ph').textContent=(n||'M').charAt(0);$('#pv_price').textContent=rp(p);$('#pv_desc').textContent=d||'Deskripsi menu tampil di sini.'}
});
document.addEventListener('submit',function(e){if(e.target.getAttribute('data-form')==='login'){e.preventDefault();location.hash='#/dashboard'}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
window.addEventListener('hashchange',render);
render();
})();
</script>
</body>
</html>
