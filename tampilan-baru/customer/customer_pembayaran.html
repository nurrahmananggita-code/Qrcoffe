<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FAF4EA">
    <title>Pembayaran — Minimal Ngopi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/customer.css">
    <link rel="stylesheet" href="../assets/css/customer-pages.css">
</head>
<body>

<div class="app">

    <header class="app-bar">
        <a href="customer_checkout.html" class="back-btn" aria-label="Kembali ke checkout">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
        <h1 class="bar-title">Pembayaran</h1>
        <span class="bar-spacer"></span>
    </header>

    <div class="app-body">
        <div class="checkout-body">

            <!-- Kartu total -->
            <div class="total-card">
                <div class="total-label">Total pembayaran</div>
                <div class="total-angka" id="total-bayar">Rp0</div>
            </div>

            <!-- Nomor pesanan dan status -->
            <div class="order-box">
                <div class="info-row">
                    <div class="info-label">No. pesanan</div>
                    <div class="info-value" id="no-pesanan">A-0000</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Status</div>
                    <div class="status-belum">Belum dibayar</div>
                </div>
            </div>

            <!-- Metode pembayaran -->
            <h3 class="section-title">Metode pembayaran</h3>

            <div class="metode-card metode-on" id="metode-qris">
                <img src="../assets/images/qris.png" alt="" class="metode-img">
                <div class="metode-info">
                    <div class="metode-nama">QRIS</div>
                    <div class="metode-desc">Scan dengan e-wallet atau mobile banking</div>
                </div>
            </div>

            <div class="metode-card" id="metode-transfer">
                <img src="../assets/images/transfer.png" alt="" class="metode-img">
                <div class="metode-info">
                    <div class="metode-nama">Transfer</div>
                    <div class="metode-desc">Virtual account bank</div>
                </div>
            </div>

            <!-- Kartu QR -->
            <div class="qr-card" id="qr-card">
                <div class="qr-box">
                    <div class="qr-gambar"></div>
                </div>
                <div class="qr-note">QR contoh · berlaku 15 menit</div>
            </div>

            <a href="customer_selesai.html" class="bayar-bar">
                Saya Sudah Bayar
            </a>
        </div>
    </div>

</div>

<script src="../assets/js/customer.js"></script>
<script src="../assets/js/customer_pembayaran.js"></script>

</body>
</html>
