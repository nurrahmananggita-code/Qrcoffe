<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FAF4EA">
    <title>Informasi Meja — Minimal Ngopi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/customer.css">
</head>
<body>

<div class="app meja-page">

    <section class="meja-hero">
        <div class="meja-photo" data-parallax></div>

        <a href="customer_scan.html" class="back-btn meja-back" aria-label="Kembali ke halaman scan">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>

        <div class="meja-hero-text">
            <p class="eyebrow on-dark">Sesi baru</p>
            <p class="muted">Kamu duduk di</p>
            <h1 class="table-no" id="nomor-meja">Meja 5</h1>
            <span class="tag">Sesi aktif · Minimal Ngopi</span>
        </div>
    </section>

    <div class="meja-body">
        <form action="customer_menu.html" class="form-name" id="form-nama">
            <label class="form-label" for="input-nama">Nama pemesan</label>
            <input type="text" class="input" id="input-nama" placeholder="Contoh: Angelika" autocomplete="name" required>
            <p class="form-help">Nama ini dipakai barista saat pesananmu siap.</p>
            <button type="submit" class="btn btn-block">
                Mulai Pesan
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M5 12h13M12 5l7 7-7 7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </form>

        <p class="meja-foot">Salah meja? <a href="customer_scan.html">Scan ulang QR</a></p>
    </div>

</div>

<script src="../assets/js/customer.js"></script>
<script src="../assets/js/customer_meja.js"></script>

</body>
</html>
