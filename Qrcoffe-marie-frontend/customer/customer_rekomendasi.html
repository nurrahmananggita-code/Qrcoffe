<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Barista - Qrcoffee</title>
    <link rel="stylesheet" href="../assets/css/customer.css">
</head>
<body>

<div class="phone">
<div class="rek-page">

    <!-- BAR ATAS -->
    <div class="rek-top">
        <a href="customer_menu.html" class="rek-back">← Kembali</a>
        <p class="rek-title" id="rek-judul">AI Barista</p>
    </div>

    <div id="rek-form">

    <!-- KARTU PENJELASAN -->
    <div class="rek-intro">
        <p class="rek-intro-title">Ceritakan seleramu</p>
        <p class="rek-intro-desc">Ketik bebas aja, kayak ngobrol sama barista.</p>
    </div>

    <!-- KOLOM CERITA -->
    <textarea id="rek-input" class="rek-input"
        placeholder="Contoh: aku lagi capek banget, pengen yang manis dan dingin, budget 25 ribuan"></textarea>

    <!-- CONTOH CERITA -->
    <p class="rek-label">Atau coba salah satu:</p>
    <button type="button" class="rek-chip">Lagi ngantuk, butuh yang kuat tapi nggak pahit banget</button>
    <button type="button" class="rek-chip">Pengen yang manis dan dingin, budget 25 ribuan</button>
    <button type="button" class="rek-chip">Nggak mau kopi, yang creamy dan hangat aja</button>
    <button type="button" class="rek-chip">Mau nemenin kerja lama, kafein tinggi</button>

    <!-- TOMBOL TANYA -->
    <button type="button" id="rek-tanya" class="rek-btn">Tanya AI Barista</button>

    </div>

    <!-- HASIL REKOMENDASI (diisi oleh JS) -->
    <div id="rek-hasil" hidden></div>

</div>
</div>

<!-- POP-UP DETAIL MENU -->
<div id="rek-popup" class="rek-popup" hidden>
    <div class="rek-popup-isi">
        <iframe id="rek-popup-frame" class="rek-popup-frame" title="Detail menu"></iframe>
    </div>
</div>

<!-- BAR KERANJANG -->
<a href="customer_keranjang.html" id="rek-cart" class="rek-cart" hidden>
    <span id="rek-cart-item"> 0 item</span>
    <span id="rek-cart-total">Rp0 →</span>
</a>

<script src="../assets/js/customer_rekomendasi.js"></script>

</body>
</html>
