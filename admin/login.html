<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Qrcoffee</title>
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body class="login-page">

    <main class="login-box">

        <h1 class="login-title">Masuk ke Admin Outlet</h1>

        <p class="login-sub">Gunakan akun PIC outlet.</p>

        <form method="post" action="dashboard.html" id="form-login">

            <div class="login-field">
                <label for="email">Email</label>
                <input class="login-input" type="email" id="email" name="email"
                       autocomplete="email" placeholder="Masukkan email" required>
            </div>

            <div class="login-field">
                <label for="password">Kata Sandi</label>
                <input class="login-input" type="password" id="password" name="password"
                       autocomplete="current-password" placeholder="Masukkan kata sandi" required>
            </div>

            <div class="login-row">
                <label>
                    <input type="checkbox" name="remember">
                    Ingat saya di perangkat ini
                </label>

                <a href="#" class="login-forgot">Lupa kata sandi?</a>
            </div>

            <button type="submit" class="login-btn">Masuk</button>

        </form>

    </main>

    <script src="../assets/js/login.js"></script>

</body>
</html>
